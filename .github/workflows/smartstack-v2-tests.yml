name: SmartStack v2 checks
on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/smartstack-v2-tests.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/smartstack-v2-tests.yml"
permissions:
  contents: read
jobs:
  recommendation-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check source
        run: |
          for file in v2/src/*.mjs v2/tests/*.mjs; do
            node --check "$file"
          done
      - name: Run recommendation and billing tests
        working-directory: v2
        run: npm test
