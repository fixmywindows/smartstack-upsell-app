name: SmartStack Shopify v2 build

on:
  push:
    paths:
      - "v2/shopify-app/**"
      - ".github/workflows/smartstack-v2-shopify-build.yml"
  pull_request:
    paths:
      - "v2/shopify-app/**"
      - ".github/workflows/smartstack-v2-shopify-build.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d smartstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/smartstack_test
      SHOPIFY_API_KEY: test_client_id
      SHOPIFY_API_SECRET: test_client_secret
      SHOPIFY_APP_URL: https://example.invalid
      SCOPES: read_products,write_app_proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: v2/shopify-app
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        working-directory: v2/shopify-app
        run: npx prisma validate
      - name: Test theme, rules and Design Studio
        working-directory: v2/shopify-app
        run: node --test tests/widget.test.mjs tests/phase2-rules.test.mjs tests/design.test.mjs tests/inline-aggregation.test.mjs tests/inline-admin.test.mjs tests/attribute-pickers.test.mjs tests/phase4.test.mjs tests/group-quotas.test.mjs tests/product-analytics.test.mjs
      - name: Typecheck app
        working-directory: v2/shopify-app
        run: npm run typecheck
      - name: Build application
        working-directory: v2/shopify-app
        run: npm run build
      - name: Verify safe legacy-set migration
        working-directory: v2/shopify-app
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test -f prisma/migrations/20261015000000_create_smartstack_v2/migration.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          INSERT INTO "MerchantShop" ("domain","updatedAt")
            VALUES ('test-shop.myshopify.com', CURRENT_TIMESTAMP);
          INSERT INTO "RecommendationBlock"
            ("id","shopDomain","kind","heading","mode","enabled","pinnedIds",
             "excludedTags","ruleGroups","updatedAt","createdAt")
          VALUES
            ('legacy-test','test-shop.myshopify.com','complement','Pairs perfectly with',
             'hybrid',true,'["gid://shopify/Product/12"]'::jsonb,
             '["hidden"]'::jsonb,
             '[{"logic":"OR","rules":[{"field":"tags","op":"contains","value":"winter"}]}]'::jsonb,
             CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);
          SQL
          npx prisma migrate resolve --applied 20261015000000_create_smartstack_v2
          npx prisma migrate deploy
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          DO $$
          DECLARE
            r record;
          BEGIN
            SELECT * INTO r FROM "RecommendationRuleSet" WHERE "legacyBlockId"='legacy-test';
            IF NOT FOUND THEN RAISE EXCEPTION 'Legacy block not migrated'; END IF;
            IF r."name" <> 'Default Complementary Products' THEN
              RAISE EXCEPTION 'Unexpected imported default name';
            END IF;
            IF r."priority" <> 100 OR r."sourceMatch" <> 'all' THEN
              RAISE EXCEPTION 'Fallback priority or targeting changed';
            END IF;
            IF r."targetLogic" <> 'OR' THEN
              RAISE EXCEPTION 'Original OR rules were not preserved';
            END IF;
            IF r."pinnedIds" <> '["gid://shopify/Product/12"]'::jsonb THEN
              RAISE EXCEPTION 'Original pinned IDs were not preserved';
            END IF;
            IF r."excludeTags" <> '["hidden"]'::jsonb THEN
              RAISE EXCEPTION 'Original exclusions were not preserved';
            END IF;
            IF r."archived" THEN RAISE EXCEPTION 'Imported set is archived'; END IF;
            IF (SELECT plan FROM "MerchantShop" WHERE domain='test-shop.myshopify.com') <> 'free' THEN
              RAISE EXCEPTION 'Default plan is not free';
            END IF;
            IF (SELECT COUNT(*) FROM "RecommendationBlock" WHERE id='legacy-test') <> 1 THEN
              RAISE EXCEPTION 'Legacy block was changed';
            END IF;
          END $$;
          SQL
      - name: Validate Phase 2 additive migration
        working-directory: v2/shopify-app
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          DO $$
          DECLARE
            r record;
          BEGIN
            SELECT * INTO r FROM "RecommendationRuleSet" WHERE "legacyBlockId"='legacy-test';
            IF NOT FOUND THEN RAISE EXCEPTION 'Phase 1 set missing after Phase 2 migration'; END IF;
            IF r."fallbackMode" <> 'next' THEN RAISE EXCEPTION 'Fallback default incorrect'; END IF;
            IF r."excludeLogic" <> 'OR' THEN RAISE EXCEPTION 'Exclusion grouping incorrect'; END IF;
            IF r."excludedProductIds" <> '[]'::jsonb OR r."excludeRules" <> '[]'::jsonb THEN
              RAISE EXCEPTION 'Exclusions must default to empty lists';
            END IF;
            IF r."pinnedIds" <> '["gid://shopify/Product/12"]'::jsonb THEN
              RAISE EXCEPTION 'Merchant pins were altered';
            END IF;
          END $$;
          SQL

      - name: Verify Phase 3 design migration preserves existing catalogue and sets
        working-directory: v2/shopify-app
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables
              WHERE table_name = 'RecommendationDesign') THEN
              RAISE EXCEPTION 'Design Studio table does not exist';
            END IF;
            IF (SELECT COUNT(*) FROM "RecommendationBlock" WHERE id='legacy-test') <> 1 THEN
              RAISE EXCEPTION 'Existing recommendation blocks were lost';
            END IF;
            IF (SELECT COUNT(*) FROM "RecommendationRuleSet" WHERE "legacyBlockId"='legacy-test') <> 1 THEN
              RAISE EXCEPTION 'Imported recommendation sets were lost';
            END IF;
            IF (SELECT plan FROM "MerchantShop" WHERE domain='test-shop.myshopify.com') <> 'free' THEN
              RAISE EXCEPTION 'Store plan changed unexpectedly';
            END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          INSERT INTO "RecommendationDesign"
            ("id","shopDomain","kind","settings","updatedAt")
          VALUES ('design-test','test-shop.myshopify.com','similar',
            '{"preset":"theme","showQuickAdd":false}'::jsonb,CURRENT_TIMESTAMP);
          SELECT "kind" FROM "RecommendationDesign" WHERE "id"='design-test';
          SQL

      - name: Verify searchable attribute values on Postgres
        working-directory: v2/shopify-app
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          INSERT INTO "MerchantShop" ("domain","updatedAt")
            VALUES ('other-shop.myshopify.com', CURRENT_TIMESTAMP);
          INSERT INTO "ProductSnapshot"
            ("shopDomain","productId","title","handle","tags","collections",
              "metafields","category","productType","vendor","updatedAt")
          VALUES
            ('test-shop.myshopify.com','gid://shopify/Product/111',
              'Alpine Snowboard','alpine-snowboard',
              '["winter","adventure"]'::jsonb,
              '["winter-sports","clearance"]'::jsonb,
              '{"custom.level":"advanced","custom.accessories":["helmet","boots"],"custom.rating":4}'::jsonb,
              'Snowboards','Boards','Test Vendor',CURRENT_TIMESTAMP),
            ('test-shop.myshopify.com','gid://shopify/Product/112',
              'Budget Snowboard','budget-snowboard',
              '["winter","budget"]'::jsonb,
              '["winter-sports"]'::jsonb,
              '{"custom.level":"beginner","custom.accessories":["boots"],"custom.rating":2}'::jsonb,
              'Snowboards','Boards','Test Vendor',CURRENT_TIMESTAMP),
            ('other-shop.myshopify.com','gid://shopify/Product/113',
              'Unrelated confidential product','unrelated',
              '["other-shop-secret"]'::jsonb,
              '["private-only"]'::jsonb,
              '{"custom.level":"private"}'::jsonb,
              'Unrelated','Other','Different Vendor',CURRENT_TIMESTAMP);
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM "ProductSnapshot" p
              CROSS JOIN LATERAL jsonb_array_elements_text(
                CASE WHEN jsonb_typeof(p."tags")='array' THEN p."tags" ELSE '[]'::jsonb END
              ) AS v(value)
              WHERE p."shopDomain"='test-shop.myshopify.com' AND v.value='winter'
            ) THEN RAISE EXCEPTION 'Synced tag choice missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM "ProductSnapshot" p
              CROSS JOIN LATERAL jsonb_array_elements_text(
                CASE WHEN jsonb_typeof(p."collections")='array' THEN p."collections" ELSE '[]'::jsonb END
              ) AS v(value)
              WHERE p."shopDomain"='test-shop.myshopify.com' AND v.value='winter-sports'
            ) THEN RAISE EXCEPTION 'Collection handle missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM "ProductSnapshot" p
              CROSS JOIN LATERAL jsonb_each(
                CASE WHEN jsonb_typeof(p."metafields")='object' THEN p."metafields" ELSE '{}'::jsonb END
              ) AS m(key,val)
              WHERE p."shopDomain"='test-shop.myshopify.com' AND m.key='custom.level'
            ) THEN RAISE EXCEPTION 'Metafield key missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM "ProductSnapshot" p
              CROSS JOIN LATERAL jsonb_array_elements_text(
                CASE WHEN jsonb_typeof(p."metafields" -> 'custom.accessories')='array'
                  THEN p."metafields" -> 'custom.accessories'
                  WHEN jsonb_typeof(p."metafields" -> 'custom.accessories') IN ('string','number','boolean')
                  THEN jsonb_build_array(p."metafields" -> 'custom.accessories')
                  ELSE '[]'::jsonb END
              ) AS choice(value)
              WHERE p."shopDomain"='test-shop.myshopify.com' AND choice.value='helmet'
            ) THEN RAISE EXCEPTION 'List metafield value missing'; END IF;
            IF EXISTS (
              SELECT 1 FROM "ProductSnapshot" p
              CROSS JOIN LATERAL jsonb_array_elements_text(
                CASE WHEN jsonb_typeof(p."tags")='array' THEN p."tags" ELSE '[]'::jsonb END
              ) AS v(value)
              WHERE p."shopDomain"='test-shop.myshopify.com' AND v.value='other-shop-secret'
            ) THEN RAISE EXCEPTION 'Cross-tenant tag leaked'; END IF;
          END $$;
          SQL

      - name: Verify Phase 4 variant and order-signal tables
        working-directory: v2/shopify-app
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables
                WHERE table_name='ProductVariantSnapshot') THEN
              RAISE EXCEPTION 'Variant table missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables
                WHERE table_name='OrderPairObservation') THEN
              RAISE EXCEPTION 'Order-pair observation table missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables
                WHERE table_name='ObservedProductPair') THEN
              RAISE EXCEPTION 'Product-pair aggregate table missing';
            END IF;
            IF (SELECT COUNT(*) FROM "RecommendationRuleSet" WHERE "legacyBlockId"='legacy-test') <> 1 THEN
              RAISE EXCEPTION 'Legacy IF/THEN set lost in Phase 4';
            END IF;
            IF (SELECT "bundleDiscountPercent" FROM "RecommendationRuleSet" WHERE "legacyBlockId"='legacy-test') <> 0 THEN
              RAISE EXCEPTION 'Bundle preview discount unexpectedly active';
            END IF;
            IF (SELECT COUNT(*) FROM "ProductSnapshot" WHERE "shopDomain"='test-shop.myshopify.com') < 1 THEN
              RAISE EXCEPTION 'Catalogue snapshots lost';
            END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          INSERT INTO "ProductVariantSnapshot"
            ("shopDomain","productId","variantId","title","priceMinor",
              "available","options","updatedAt")
          VALUES ('test-shop.myshopify.com','gid://shopify/Product/111',
            'gid://shopify/ProductVariant/888','Blue / Large',9999,true,
            '[{"name":"Colour","value":"Blue"},{"name":"Size","value":"Large"}]'::jsonb,
            CURRENT_TIMESTAMP);
          INSERT INTO "ObservedProductPair"
            ("shopDomain","productA","productB","orderCount","updatedAt")
          VALUES ('test-shop.myshopify.com',
            'gid://shopify/Product/111','gid://shopify/Product/112',2,CURRENT_TIMESTAMP);
          SELECT "variantId","title" FROM "ProductVariantSnapshot"
            WHERE "shopDomain"='test-shop.myshopify.com';
          SQL

      - name: Verify Phase 5 analytic attribution and group-allocation migration
        working-directory: v2/shopify-app
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U test -d smartstack_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables
                WHERE table_name='RecommendationEvent') THEN
              RAISE EXCEPTION 'Consent-based event table is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables
                WHERE table_name='RecommendationPurchase') THEN
              RAISE EXCEPTION 'Verified purchase ledger table is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                WHERE table_name='RecommendationRuleSet' AND column_name='targetMode') THEN
              RAISE EXCEPTION 'Legacy-safe allocation mode missing';
            END IF;
            IF (SELECT "targetMode" FROM "RecommendationRuleSet" WHERE "legacyBlockId"='legacy-test') <> 'filter' THEN
              RAISE EXCEPTION 'Imported matching semantics changed';
            END IF;
          END $$;
          SQL
