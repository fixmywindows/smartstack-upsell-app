name: SmartStack Shopify v2 compile checks
on:
  push:
    paths:
      - "v2/shopify-app/**"
      - ".github/workflows/smartstack-v2-install.yml"
  pull_request:
    paths:
      - "v2/shopify-app/**"
      - ".github/workflows/smartstack-v2-install.yml"
permissions:
  contents: read
jobs:
  install-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:local@localhost:5432/smartstack_test
      SHOPIFY_API_KEY: test_client_id
      SHOPIFY_API_SECRET: test_client_secret
      SHOPIFY_APP_URL: https://example.invalid
      SCOPES: read_products,write_app_proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: v2/shopify-app
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        working-directory: v2/shopify-app
        run: npx prisma validate
      - name: Typecheck
        working-directory: v2/shopify-app
        run: npm run typecheck
      - name: Build
        working-directory: v2/shopify-app
        run: npm run build
